name: alva
description: "Habit tracker com UI escura, anel de progresso em vidro com brilho pulsante e dock flutuante."
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 300
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_light.png"
  adaptive_icon_background: "#E6E6E9"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 24
